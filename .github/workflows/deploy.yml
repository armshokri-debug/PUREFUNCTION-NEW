name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      # Base path = /<repo name>/ so the app works at https://audiovido.github.io/Purefunction-2/
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          # Cloud project "pure-function-2". Both values are public by design;
          # access is enforced by Row Level Security in the database.
          VITE_SUPABASE_URL: https://rugwzvztweiffprkxfdc.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Z0naU2LSCJJNEUFWqkoyHg_0AJo4yiw
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
